name: Build bundle

# Note: intentionally no `push` trigger here. GitHub Actions runs a push
# workflow using the version of the workflow file present on the pushed
# branch/ref — this file only exists on `main`, so a push to `backend`,
# `frontend`, or `cli` would never see it and could never trigger it.
# Instead we rebuild on a schedule (and on demand) so the bundle stays in
# sync with whatever the tracked branches currently point at.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with submodules)
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and push bundle
        run: node scripts/build-bundle.mjs --push
